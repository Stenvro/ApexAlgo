services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      # Loopback-only by default; set BIND_ADDR=0.0.0.0 for LAN access
      - "${BIND_ADDR:-127.0.0.1}:8000:8000"
    volumes:
      - ./data:/app/data
      - ./backend:/app/backend:ro
    environment:
      # Group that keeps read access to data/.env on the host
      - HOST_GID=${HOST_GID:-1000}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,ssl; urllib.request.urlopen('https://localhost:8000/health', context=ssl._create_unverified_context())"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      # Loopback-only by default; set BIND_ADDR=0.0.0.0 for LAN access
      - "${BIND_ADDR:-127.0.0.1}:5173:5173"
    volumes:
      - ./data:/app/data
      - ./frontend/src:/app/frontend/src
      - ./examples:/app/examples:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
